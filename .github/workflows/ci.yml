name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: |
          npm run typecheck
          npm run typecheck:examples
          npm run typecheck:uppy-example
          npm run typecheck:inspection-ui-example

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Reference integration
        run: npm run test:reference

      - name: Verify package contents
        run: npm pack --dry-run

      - name: Verify packaged onboarding
        run: node --import tsx scripts/verify-onboarding-package.cts

      - name: Audit
        run: npm audit --audit-level=moderate

      - name: Pack qualified distribution
        run: |
          mkdir -p "$RUNNER_TEMP/lii-package"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/lii-package"

      - name: Retain distribution for consumer matrix
        uses: actions/upload-artifact@v4
        with:
          name: consumer-package
          path: ${{ runner.temp }}/lii-package/*.tgz

  package-consumers:
    name: Consumer (${{ matrix.manager }})
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - manager: npm
            tool: npm@10.8.2
          - manager: pnpm
            tool: pnpm@10.32.1
          - manager: yarn
            tool: '@yarnpkg/cli-dist@4.12.0'
          - manager: bun
            tool: bun@1.3.5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install repository tooling
        run: npm ci
      - name: Install pinned consumer manager
        run: |
          npm install --prefix "$RUNNER_TEMP/manager-tools" --no-audit --no-fund "${{ matrix.tool }}"
          echo "$RUNNER_TEMP/manager-tools/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@v4
        with:
          name: consumer-package
          path: ${{ runner.temp }}/lii-package
      - name: Qualify installed package and executable examples
        run: node --import tsx scripts/verify-onboarding-package.cts --manager "${{ matrix.manager }}" --package "$RUNNER_TEMP"/lii-package/*.tgz
