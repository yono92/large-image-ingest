name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish with provenance
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # npm Trusted Publishing (OIDC) needs Node.js 22.14.0 or newer.
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      # npm Trusted Publishing (OIDC) needs npm 11.5.1 or newer.
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.21.1

      - name: Check tag matches package version
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Check bundle size
        run: npm run build && npm run size

      # prepublishOnly runs the full release verification before upload.
      - name: Publish
        run: npm publish --provenance --access public --loglevel verbose
